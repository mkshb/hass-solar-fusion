take_snapshot:
  name: Take Morning Snapshot
  description: >-
    Manually triggers the 06:00 morning forecast snapshot for all Solar Fusion
    instances. Useful after initial setup or a late restart to initialise
    accuracy tracking without waiting until the next morning.

repair_history:
  name: Repair History
  description: >-
    Re-reads actual PV production from the Home Assistant recorder and corrects
    any corrupted actual_kwh values in the history (e.g. caused by the
    utility-meter carryover bug). Runs automatically at startup for detected
    carryover duplicates; call this service manually to repair a specific date
    range.
  fields:
    date_from:
      name: From date
      description: First date to repair (YYYY-MM-DD). Defaults to the earliest history entry.
      required: false
      example: "2026-03-16"
      selector:
        date:
    date_to:
      name: To date
      description: Last date to repair (YYYY-MM-DD). Defaults to the latest history entry.
      required: false
      example: "2026-03-19"
      selector:
        date:

learn_shading:
  name: Learn Shading From Recorder
  description: >-
    Learns the shading map retroactively. Rebuilds each source's 06:00 hourly
    forecast from the recorder state history (only sources whose hourly
    attribute is recorded, e.g. Open-Meteo "wh_period"; Solcast's
    "detailedHourly" is not recorded) and reads hourly production from the
    long-term statistics. Only reaches back as far as the recorder keeps state
    history (default 10 days). Days that already have an hourly morning
    snapshot are kept.
  fields:
    days:
      name: Days
      description: How many past days to reconstruct.
      required: false
      default: 10
      example: 10
      selector:
        number:
          min: 1
          max: 60
          mode: box
