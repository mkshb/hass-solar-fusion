name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  unit:
    name: Unit tests (no Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run dependency-free unit tests
        run: |
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t" || exit 1
            echo "::endgroup::"
          done

  integration:
    name: Integration tests (Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test requirements
        run: pip install -r requirements_test.txt
      - name: Run integration tests
        run: pytest tests_ha
