name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  unit:
    name: Unit tests (no Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check card syntax
        run: node --check custom_components/solar_fusion/frontend/solar-fusion-card.js
      - name: Run dependency-free unit tests
        run: |
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t" || exit 1
            echo "::endgroup::"
          done

  integration:
    name: Integration tests (Home Assistant) and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test requirements
        run: |
          pip install -r requirements_test.txt
          python -m playwright install --with-deps chromium
      - name: Run unit and integration tests with coverage
        run: |
          coverage run -m pytest tests
          coverage run -m pytest tests_ha
          coverage combine
      - name: Upload card screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: card-screenshot
          path: tests_ha/card/output/
          if-no-files-found: ignore
      - name: Coverage report
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
          coverage report
